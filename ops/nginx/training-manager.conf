# Reverse proxy HTTPS — formations.example.ch
# TLS terminé ici ; l'application écoute sur 127.0.0.1:3000 ; le service PDF
# (127.0.0.1:8090) n'est JAMAIS exposé.

limit_req_zone $binary_remote_addr zone=tm_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tm_api:10m rate=20r/s;

upstream training_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name formations.example.ch;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name formations.example.ch;

    ssl_certificate     /etc/letsencrypt/live/formations.example.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formations.example.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Les en-têtes de sécurité applicatifs (CSP, X-Frame-Options…) sont posés par l'application.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 3m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Aucun corps de requête ni en-tête Authorization/Cookie dans les journaux.
    access_log /var/log/nginx/training-manager.access.log combined;

    location = /api/v1/auth/login {
        limit_req zone=tm_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://training_web;
        include /etc/nginx/snippets/training-proxy.conf;
    }

    location /api/ {
        limit_req zone=tm_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://training_web;
        include /etc/nginx/snippets/training-proxy.conf;
        proxy_read_timeout 90s; # génération de rapports PDF
    }

    location /_nuxt/ {
        proxy_pass http://training_web;
        include /etc/nginx/snippets/training-proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://training_web;
        include /etc/nginx/snippets/training-proxy.conf;
    }
}
