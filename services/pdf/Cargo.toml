[package]
name = "training-pdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Service de génération des rapports PDF (Krilla) du Training Manager."
license = "UNLICENSED"
publish = false

[[bin]]
name = "training-pdf"
path = "src/main.rs"

[lib]
name = "training_pdf"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
krilla = { version = "0.8", default-features = false, features = ["simple-text"] }
krilla-svg = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.42"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
usvg = { version = "0.47", default-features = false, features = ["text"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
